[project]
name = "camera-xenics"
version = "0.1.0"
description = "Control of Xenics cameras (Bobcat-320)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_xenics"]

[tool.pytest.ini_options]
markers = ["hardware: needs the real device connected (deselected by default)"]
addopts = "-m 'not hardware'"
